services:
  - type: web
    name: greenhouse-customer-support-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run start --workspace=api
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
